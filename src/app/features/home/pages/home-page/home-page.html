<section class="max-w-7xl mx-auto p-4 md:p-8">
  
  <app-hero 
    [title]="'Listado de Países'"
    [total]="countriesResource.hasValue() ? countriesResource.value()!.length : null"
    [isLoading]="countriesResource.isLoading()"
    [hasError]="countriesResource.error() !== undefined">
  </app-hero>

  @if (countriesResource.isLoading()) {
    <div class="flex justify-center items-center h-48">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  }

  @if (countriesResource.error()) {
    <div class="alert alert-error shadow-md max-w-lg mx-auto">
      <span>Ocurrió un error al cargar el listado.</span>
    </div>
  }

  @if (countriesResource.hasValue()) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      @for (country of countriesResource.value(); track country.name.common) {
        <app-card 
          [item]="country" 
          [total]="countriesResource.value()!.length">
        </app-card>
      }
    </div>
  }
</section>
